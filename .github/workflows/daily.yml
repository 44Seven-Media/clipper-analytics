name: Daily stats

# Once a day: fetch every account's followers and views and save them in Supabase.
# Run it by hand any time from the Actions tab → "Daily stats" → "Run workflow".
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 AM Central (5:00 AM in winter)
  workflow_dispatch: {}

permissions:
  contents: write          # only to update status/last-run.json (counts, no numbers)

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # This repo is public, so never fall back to writing numbers into it.
      - name: Check Supabase is set up
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL variable and SUPABASE_SERVICE_ROLE_KEY secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Collect today's numbers
        run: clipper collect --github --status-file status/last-run.json

      # GitHub pauses scheduled jobs in public repos after 60 days without a commit.
      # This small daily commit (date and counts only) keeps the schedule running.
      - name: Record the run
        if: always()
        run: |
          [ -f status/last-run.json ] || exit 0
          git config user.name  "clipper-stats[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last-run.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily stats ran $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
