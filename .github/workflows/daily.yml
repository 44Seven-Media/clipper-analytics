name: Daily stats

# Once a day: fetch every account's followers and views, add them to data/, rebuild the dashboard.
# Run it by hand any time from the Actions tab → "Daily stats" → "Run workflow".
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 AM Central (5:00 AM in winter)
  workflow_dispatch: {}

permissions:
  contents: write          # commit the new numbers back to this repo; nothing else

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Collect today's numbers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          CLIPPER_TOKEN_KEY: ${{ secrets.CLIPPER_TOKEN_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: clipper collect --github

      # Runs even if some accounts failed: their rows say why, and the dashboard shows it.
      - name: Commit and push
        if: always()
        run: |
          git config user.name  "clipper-stats[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Daily stats $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
